<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Kali Lab dragon icon</title>
  <desc id="desc">Black right-facing dragon mark on a white square background, based on the supplied reference.</desc>
  <rect width="300" height="300" fill="#fff"/>

  <!-- Three fine, swept-back horns/tendrils. -->
  <path fill="#050505" d="M163 59C125 42 76 37 27 39c48 7 95 16 133 27z"/>
  <path fill="#050505" d="M160 67C111 64 60 68 13 76c51-4 101-3 148 0z"/>
  <path fill="#050505" d="M161 74c-45 10-88 25-132 42 45-11 91-23 137-32z"/>

  <!-- Open coiled neck and long tapered lower sweep. -->
  <path d="M176 96C160 105 151 117 149 133c-3 20 8 37 25 43 12 5 27 4 43 4 40 0 68 15 84 45"
        fill="none" stroke="#050505" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M162 60c1 18 4 29 15 37 12-5 25-4 39 0 17 5 33 16 46 29"
        fill="none" stroke="#050505" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right-facing head, snout, and small swept scales. -->
  <path fill="#050505" d="M248 111c7 2 12 9 16 15l12 9-7 5-13-7-10-12z"/>
  <path fill="#050505" d="m213 96 7-4 9 12-5 2zm14 5 7-3 8 11-5 2zm13 6 7-2 7 10-5 2z"/>
</svg>
